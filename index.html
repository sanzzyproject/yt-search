<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SANN404 FORUM - Spotify Clone</title>
    <style>
        :root {
            --bg-base: #121212;
            --bg-highlight: #1a1a1a;
            --text-main: #ffffff;
            --text-sub: #a7a7a7;
            --spotify-green: #1ed760;
            --nav-bg: rgba(0, 0, 0, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* --- SISTEM TAMPILAN HALAMAN --- */
        .view-section {
            display: none;
            animation: fadeIn 0.2s ease;
        }
        .view-section.active {
            display: block;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- HEADER & TOP PILLS (HOME) --- */
        .home-header {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            background: var(--bg-base);
            z-index: 50;
        }
        .profile-icon {
            width: 32px; height: 32px;
            background-color: #d9534f;
            color: white;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 14px;
        }
        .pill {
            background-color: #2a2a2a;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .pill.active {
            background-color: var(--spotify-green);
            color: black;
        }

        /* --- BAGIAN HOME SECTIONS --- */
        .section-container {
            margin-bottom: 32px;
        }
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 16px 16px 16px;
            letter-spacing: -0.5px;
        }

        /* List Vertikal (Sering diputar) */
        .vertical-list {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .v-item {
            display: grid;
            grid-template-columns: 48px 1fr 24px;
            gap: 12px;
            align-items: center;
            cursor: pointer;
        }
        .v-img {
            width: 48px; height: 48px;
            object-fit: cover;
            border-radius: 2px;
            background: #282828;
        }
        .v-info { overflow: hidden; }
        .v-title {
            font-size: 16px; font-weight: 400; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .v-sub {
            font-size: 13px; color: var(--text-sub);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .dots-icon {
            fill: var(--text-sub); width: 20px; height: 20px;
        }

        /* Horizontal Scroll Cards (Tangga Lagu, dll) */
        .horizontal-scroll {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 16px;
            padding: 0 16px;
        }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        .h-card {
            width: 140px;
            flex-shrink: 0;
            scroll-snap-align: start;
            cursor: pointer;
        }
        .h-img {
            width: 140px; height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #282828;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .h-img.artist-img { border-radius: 50%; }
        .h-title {
            font-size: 13px; font-weight: 600;
            line-height: 1.2; margin-bottom: 4px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .h-sub {
            font-size: 12px; color: var(--text-sub);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* --- HALAMAN PENCARIAN (SEARCH VIEW) --- */
        .search-header-container {
            padding: 40px 16px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .search-header-container h1 {
            font-size: 24px; font-weight: 700;
        }
        .camera-icon {
            margin-left: auto;
            width: 28px; height: 28px;
            fill: white;
        }
        .search-box-wrapper {
            margin: 0 16px 20px;
            position: relative;
        }
        .search-icon-input {
            position: absolute; left: 12px; top: 12px; width: 24px; height: 24px; fill: #121212;
        }
        .search-box {
            width: 100%; padding: 14px 14px 14px 44px;
            border-radius: 4px; border: none; font-size: 15px; font-weight: 500;
            background: white; color: black; outline: none;
        }

        /* Kategori Grid Pencarian ala Spotify */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 0 16px;
            margin-bottom: 30px;
        }
        .category-card {
            border-radius: 8px;
            padding: 12px 12px 0 12px;
            height: 95px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .category-title {
            font-size: 16px;
            font-weight: 700;
            color: white;
            z-index: 2;
            position: relative;
            line-height: 1.2;
        }
        .category-img {
            position: absolute;
            right: -15px;
            bottom: -5px;
            width: 65px;
            height: 65px;
            transform: rotate(25deg);
            border-radius: 4px;
            box-shadow: -4px 4px 10px rgba(0,0,0,0.3);
            object-fit: cover;
        }

        /* --- HALAMAN ARTIS KHUSUS --- */
        .artist-header {
            padding: 40px 16px 20px;
            background: linear-gradient(to bottom, #4a4a4a, var(--bg-base));
            display: flex; flex-direction: column; gap: 16px;
        }
        .back-btn {
            background: rgba(0,0,0,0.5); border: none; color: white;
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .artist-title { font-size: 40px; font-weight: 800; }
        .play-btn-large {
            background: var(--spotify-green); width: 48px; height: 48px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; margin: 16px 16px 0;
        }

        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9) 20%, #000);
            display: flex; justify-content: space-around;
            padding: 12px 0 16px; z-index: 1000;
        }
        .nav-item {
            color: var(--text-sub); text-decoration: none; font-size: 10px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active { color: var(--text-main); }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }

        /* --- MODAL LIRIK --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #535353 0%, #121212 100%);
            z-index: 2000; display: none; flex-direction: column;
            animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 40px 20px 20px;
        }
        .modal-body {
            flex: 1; overflow-y: auto; padding: 0 24px 60px;
            font-size: 24px; font-weight: 700; line-height: 1.5; white-space: pre-wrap;
        }
        .modal-body::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="view-home" class="view-section active">
        <div class="home-header">
            <div class="profile-icon">T</div>
            <div class="pill active">Semua</div>
            <div class="pill">Musik</div>
            <div class="pill">Podcast</div>
        </div>

        <div class="section-container">
            <h2 class="section-title">Sering kamu putar baru-baru ini</h2>
            <div class="vertical-list" id="recentList">
                <div style="color:#a7a7a7; font-size: 13px;">Memuat data...</div>
            </div>
        </div>

        <div class="section-container">
            <h2 class="section-title">Tangga Lagu</h2>
            <div class="horizontal-scroll" id="rowCharts"></div>
        </div>

        <div class="section-container">
            <h2 class="section-title">Baru diputar</h2>
            <div class="horizontal-scroll" id="rowBaru"></div>
        </div>

        <div class="section-container">
            <h2 class="section-title">Dibuat Untuk TikTok</h2>
            <div class="horizontal-scroll" id="rowTiktok"></div>
        </div>

        <div class="section-container">
            <h2 class="section-title">Artis Terpopuler Saat Ini</h2>
            <div class="horizontal-scroll" id="rowArtists"></div>
        </div>
    </div>

    <div id="view-search" class="view-section">
        <div class="search-header-container">
            <div class="profile-icon" style="background-color: #ff5722;">T</div>
            <h1>Cari</h1>
            <svg class="camera-icon" viewBox="0 0 24 24"><path d="M12 16a4 4 0 100-8 4 4 0 000 8zm0-2a2 2 0 110-4 2 2 0 010 4zM2.85 7h3.3l1.55-2.5h8.6L17.85 7h3.3C22.25 7 23 7.75 23 8.85v10.3c0 1.1-.75 1.85-1.85 1.85H2.85C1.75 21 1 20.25 1 19.15V8.85C1 7.75 1.75 7 2.85 7zm0 12h18.3V9H2.85v10z"></path></svg>
        </div>
        
        <div class="search-box-wrapper">
            <svg class="search-icon-input" viewBox="0 0 24 24"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 101.414-1.414l-4.344-4.344a9.157 9.157 0 002.077-5.816c0-5.14-4.226-9.279-9.407-9.279zm-7.407 9.279c0-4.006 3.302-7.279 7.407-7.279s7.407 3.273 7.407 7.279-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.279z"></path></svg>
            <input type="text" class="search-box" id="searchInput" placeholder="Apa yang ingin kamu dengarkan?">
        </div>

        <div id="searchCategoriesUI">
            <h2 class="section-title">Jelajahi semua</h2>
            <div class="category-grid" id="categoryGrid">
                </div>
        </div>

        <div id="searchResultsUI" style="display: none;">
            <div class="vertical-list" id="searchResults"></div>
        </div>
    </div>

    <div id="view-artist" class="view-section">
        <div class="artist-header">
            <button class="back-btn" onclick="switchView('home')">
                <svg viewBox="0 0 24 24" style="fill:white; width:20px; height:20px;"><path d="M15.957 2.793a1 1 0 010 1.414L8.164 12l7.793 7.793a1 1 0 11-1.414 1.414L5.336 12l9.207-9.207a1 1 0 011.414 0z"></path></svg>
            </button>
            <h1 class="artist-title" id="artistNameDisplay">Nama Artis</h1>
        </div>
        <div class="play-btn-large">
            <svg viewBox="0 0 24 24" style="fill:black; width:24px; height:24px;"><path d="M7.05 3.606l13.49 7.788a.7.7 0 010 1.212L7.05 20.394A.7.7 0 016 19.788V4.212a.7.7 0 011.05-.606z"></path></svg>
        </div>
        <div class="section-container" style="margin-top: 24px;">
            <h2 class="section-title" style="font-size: 18px;">Populer</h2>
            <div class="vertical-list" id="artistTracksContainer"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchView('home')">
            <svg viewBox="0 0 24 24"><path d="M12.5 3.247a1 1 0 00-1 0L4 7.577V20h4.5v-6a1 1 0 011-1h5a1 1 0 011 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 013 0l7.5 4.33a2 2 0 011 1.732V21a1 1 0 01-1 1h-6.5a1 1 0 01-1-1v-6h-3v6a1 1 0 01-1 1H3a1 1 0 01-1-1V7.577a2 2 0 011-1.732l7.5-4.33z"></path></svg>
            Home
        </div>
        <div class="nav-item" onclick="switchView('search')">
            <svg viewBox="0 0 24 24"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 101.414-1.414l-4.344-4.344a9.157 9.157 0 002.077-5.816c0-5.14-4.226-9.279-9.407-9.279zm-7.407 9.279c0-4.006 3.302-7.279 7.407-7.279s7.407 3.273 7.407 7.279-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.279z"></path></svg>
            Cari
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M14.5 2.134a1 1 0 011 0l6 3.464a1 1 0 01.5.866V21a1 1 0 01-1 1h-6a1 1 0 01-1-1V3a1 1 0 01.5-.866zM16 4.732V20h4V7.041l-4-2.309zM3 22a1 1 0 01-1-1V3a1 1 0 012 0v18a1 1 0 01-1 1zm6 0a1 1 0 01-1-1V3a1 1 0 012 0v18a1 1 0 01-1 1z"></path></svg>
            Koleksi Kamu
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.625.625 0 01-.858.205c-2.35-1.435-5.305-1.76-8.785-.965a.625.625 0 11-.286-1.216c3.818-.87 7.075-.5 9.724 1.118.307.188.404.58.205.858zm1.22-2.73a.78.78 0 01-1.074.256c-2.71-1.666-6.87-2.14-9.845-1.173a.781.781 0 11-.482-1.486c3.428-1.114 8.01-.58 11.145 1.33a.78.78 0 01.256 1.073zm.12-2.845C14.71 8.94 8.52 8.71 4.965 9.79a.976.976 0 11-.57-1.864c4.075-1.24 10.9-1.004 14.653 1.222a.976.976 0 01-.913 1.68x"></path></svg>
            Premium
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M11 11V4h2v7h7v2h-7v7h-2v-7H4v-2h7z"></path></svg>
            Buat
        </div>
    </nav>

    <div id="lyricsModal" class="modal-overlay">
        <div class="modal-header">
            <h3 style="text-transform:uppercase; font-size: 14px; letter-spacing: 1px;">Lirik</h3>
            <div onclick="closeLyrics()" style="width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer;">✕</div>
        </div>
        <div id="lyricsBody" class="modal-body"></div>
    </div>

    <script>
        // --- 1. SISTEM NAVIGASI ---
        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            
            const navItems = document.querySelectorAll('.bottom-nav .nav-item');
            if(viewName === 'home') {
                navItems[0].classList.add('active'); navItems[1].classList.remove('active');
            } else if (viewName === 'search') {
                navItems[0].classList.remove('active'); navItems[1].classList.add('active');
            }
        }

        // --- 2. RENDER KOMPONEN UI ---
        const dotsSvg = '<svg class="dots-icon" viewBox="0 0 24 24"><path d="M4.5 13.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm15 0a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm-7.5 0a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"></path></svg>';
        
        function createListHTML(track) {
            const img = track.thumbnails ? track.thumbnails[track.thumbnails.length - 1].url : '';
            const artist = track.artists ? track.artists.map(a => a.name).join(', ') : 'Unknown';
            return `
                <div class="v-item" onclick="getLyrics('${track.videoId}')">
                    <img src="${img}" class="v-img">
                    <div class="v-info">
                        <div class="v-title">${track.title}</div>
                        <div class="v-sub">${artist}</div>
                    </div>
                    ${dotsSvg}
                </div>
            `;
        }

        function createCardHTML(track, isArtist = false) {
            const img = track.thumbnails ? track.thumbnails[track.thumbnails.length - 1].url : '';
            const artist = track.artists ? track.artists.map(a => a.name).join(', ') : 'Unknown';
            
            const clickAction = isArtist ? `openArtistView('${track.title}')` : `getLyrics('${track.videoId}')`;
            const imgClass = isArtist ? 'h-img artist-img' : 'h-img';
            const title = track.title;
            const sub = isArtist ? 'Artis' : artist;

            return `
                <div class="h-card" onclick="${clickAction}">
                    <img src="${img}" class="${imgClass}">
                    <div class="h-title">${title}</div>
                    <div class="h-sub">${sub}</div>
                </div>
            `;
        }

        // --- 3. FETCH DATA BERANDA (DENGAN FILTER ANTI DUPLIKAT ARTIS) ---
        async function fetchAndRender(query, containerId, formatType, isArtist = false) {
            try {
                const response = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    let tracks = result.data;

                    // Logika khusus untuk menghilangkan duplikat pada Artis
                    if (isArtist) {
                        const uniqueArtists = [];
                        const seenNames = new Set();
                        
                        for (const track of tracks) {
                            if (track.artists && track.artists.length > 0) {
                                const artistName = track.artists[0].name;
                                // Jika artis belum ada di list, masukkan!
                                if (!seenNames.has(artistName)) {
                                    seenNames.add(artistName);
                                    uniqueArtists.push({
                                        title: artistName, // Jadikan nama artis sebagai title card
                                        thumbnails: track.thumbnails,
                                        videoId: track.videoId
                                    });
                                }
                            }
                        }
                        tracks = uniqueArtists;
                    }

                    // Potong array sesuai kebutuhan (List butuh 4, Card butuh 8)
                    tracks = tracks.slice(0, formatType === 'list' ? 4 : 8);
                    
                    let html = '';
                    tracks.forEach(track => {
                        html += formatType === 'list' ? createListHTML(track) : createCardHTML(track, isArtist);
                    });
                    document.getElementById(containerId).innerHTML = html;
                }
            } catch (error) {
                document.getElementById(containerId).innerHTML = '<div style="color:var(--text-sub); font-size:12px;">Gagal memuat.</div>';
            }
        }

        function loadHomeData() {
            fetchAndRender('lagu sering diputar indonesia hits', 'recentList', 'list');
            fetchAndRender('top 50 indonesia playlist update terbaru', 'rowCharts', 'card');
            fetchAndRender('lagu viral terbaru 2026', 'rowBaru', 'card');
            fetchAndRender('lagu fyp tiktok viral jedag jedug', 'rowTiktok', 'card');
            // Query untuk mendapatkan ragam penyanyi terkenal tanpa duplikat
            fetchAndRender('penyanyi pop indonesia paling hits', 'rowArtists', 'card', true);
        }

        // --- 4. RENDER GRID KATEGORI PENCARIAN ---
        function renderSearchCategories() {
            const categories = [
                { title: 'Dibuat Untuk Kamu', color: '#8d67ab', img: 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&q=80' },
                { title: 'Rilis Mendatang', color: '#188653', img: 'https://images.unsplash.com/photo-1493225457124-a1a2a5956093?w=100&q=80' },
                { title: 'Rilis Baru', color: '#739c18', img: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&q=80' },
                { title: 'Ramadan', color: '#188653', img: 'https://images.unsplash.com/photo-1584551246679-0daf3d275d0f?w=100&q=80' },
                { title: 'Pop', color: '#477d95', img: 'https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=100&q=80' },
                { title: 'Indie', color: '#e1118c', img: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&q=80' },
                { title: 'Musik Indonesia', color: '#e8115b', img: 'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=100&q=80' },
                { title: 'Tangga Lagu', color: '#8d67ab', img: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&q=80' },
                { title: 'Peringkat Podcast', color: '#1e3264', img: 'https://images.unsplash.com/photo-1593697821252-0c9137d9fc45?w=100&q=80' },
                { title: 'K-pop', color: '#e8115b', img: 'https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=100&q=80' }
            ];

            let html = '';
            categories.forEach(cat => {
                html += `
                    <div class="category-card" style="background-color: ${cat.color};">
                        <div class="category-title">${cat.title}</div>
                        <img src="${cat.img}" class="category-img" alt="Cover">
                    </div>
                `;
            });
            document.getElementById('categoryGrid').innerHTML = html;
        }

        // --- 5. LOGIKA INPUT PENCARIAN DINAMIS ---
        let searchTimeout;
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            const resultsUI = document.getElementById('searchResultsUI');
            const categoriesUI = document.getElementById('searchCategoriesUI');
            const resultsContainer = document.getElementById('searchResults');

            if (query.length === 0) {
                // Tampilkan Grid kembali jika input kosong
                categoriesUI.style.display = 'block';
                resultsUI.style.display = 'none';
                return;
            }

            // Sembunyikan Grid dan tampilkan Hasil
            categoriesUI.style.display = 'none';
            resultsUI.style.display = 'block';

            searchTimeout = setTimeout(async () => {
                resultsContainer.innerHTML = '<div style="color:var(--text-sub); text-align:center; margin-top: 20px;">Mencari...</div>';
                
                try {
                    const response = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
                    const result = await response.json();
                    if (result.status === 'success') {
                        let html = '';
                        result.data.forEach(track => { html += createListHTML(track); });
                        resultsContainer.innerHTML = html;
                    }
                } catch (error) {}
            }, 800);
        });

        // --- 6. FITUR HALAMAN ARTIS ---
        async function openArtistView(artistName) {
            document.getElementById('artistNameDisplay').innerText = artistName;
            document.getElementById('artistTracksContainer').innerHTML = '<div style="color:var(--text-sub); text-align:center;">Memuat lagu...</div>';
            
            switchView('artist');

            try {
                const response = await fetch(`/api/search?query=${encodeURIComponent(artistName + " official audio")}`);
                const result = await response.json();
                if (result.status === 'success') {
                    let html = '';
                    result.data.forEach(track => { html += createListHTML(track); });
                    document.getElementById('artistTracksContainer').innerHTML = html;
                }
            } catch(e) {}
        }

        // --- 7. LOGIKA LIRIK TERBARU ---
        const lyricsModal = document.getElementById('lyricsModal');
        const lyricsBody = document.getElementById('lyricsBody');

        async function getLyrics(videoId) {
            lyricsModal.style.display = 'flex';
            lyricsBody.innerHTML = '<div style="color:var(--text-sub); font-size: 16px; text-align: center; margin-top: 40px;">Menarik data lirik dari server... ⏳</div>';

            try {
                const response = await fetch(`/api/lyrics?video_id=${videoId}`);
                const result = await response.json();
                
                if(result.status === 'success' && result.data.lyrics) {
                    lyricsBody.innerHTML = result.data.lyrics;
                } else {
                    lyricsBody.innerHTML = `
                        <div style="color:var(--text-sub); font-size: 16px; text-align: center; margin-top: 40px;">
                            Wah, lirik belum tersedia di database pusat.<br>
                            <span style="font-size: 13px; margin-top:10px; display:inline-block;">(Lagu ini mungkin instrumental atau belum memiliki lirik resmi).</span>
                        </div>`;
                }
            } catch(e) {
                lyricsBody.innerHTML = '<div style="color:#ff5252; font-size: 16px; text-align: center; margin-top: 40px;">Gagal memuat lirik. Periksa koneksi internet Anda.</div>';
            }
        }

        function closeLyrics() {
            lyricsModal.style.display = 'none';
            lyricsBody.innerHTML = '';
        }

        // Jalankan saat web dibuka
        window.onload = () => {
            loadHomeData();
            renderSearchCategories();
        };
    </script>
</body>
</html>
