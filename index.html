<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SANN404 FORUM - Music Player</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --surface-color: #1c1c21;
            --accent-color: #6d28d9;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border-radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding-bottom: 90px;
        }

        header {
            padding: 24px 20px 16px;
            position: sticky;
            top: 0;
            background: rgba(15, 15, 19, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .search-container {
            padding: 0 20px;
            margin-top: 16px;
        }

        .search-box {
            width: 100%;
            background: var(--surface-color);
            border: none;
            padding: 16px 20px;
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        .search-box:focus {
            box-shadow: 0 0 0 2px var(--accent-color);
        }

        .content-section {
            padding: 24px 20px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .track-item {
            display: flex;
            align-items: center;
            background: var(--surface-color);
            padding: 12px;
            border-radius: 16px;
            gap: 16px;
            transition: transform 0.2s ease;
        }

        .track-item:active {
            transform: scale(0.98);
        }

        .track-img {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: cover;
            background: #2a2a32;
        }

        .track-info {
            flex: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .track-artist {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-action {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(28, 28, 33, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 16px 20px 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 1000;
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .loader {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>SANN404 FORUM</h1>
        <p>Music Hub</p>
    </header>

    <div class="search-container">
        <input type="text" class="search-box" id="searchInput" placeholder="Cari lagu, artis, atau album...">
    </div>

    <div class="content-section">
        <h2 class="section-title" id="statusTitle">Lagu Populer</h2>
        <div id="loader" class="loader">Memuat data dari server...</div>
        <div class="track-list" id="resultsContainer"></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active">🏠 Home</div>
        <div class="nav-item">🔍 Explore</div>
        <div class="nav-item">📚 Library</div>
    </nav>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const statusTitle = document.getElementById('statusTitle');
        const loader = document.getElementById('loader');

        function createTrackElement(title, artist, imgUrl, videoId) {
            return `
                <div class="track-item">
                    <img src="${imgUrl}" alt="Cover" class="track-img">
                    <div class="track-info">
                        <div class="track-title">${title}</div>
                        <div class="track-artist">${artist}</div>
                    </div>
                    <button class="btn-action" onclick="getLyrics('${videoId}')">Lirik</button>
                </div>
            `;
        }

        async function loadCharts() {
            loader.style.display = 'block';
            resultsContainer.innerHTML = '';
            statusTitle.innerText = "Lagu Trending";

            try {
                const response = await fetch('/api/charts');
                const result = await response.json();
                
                if (result.status === 'success' && result.data.videos) {
                    const tracks = result.data.videos.items.slice(0, 10);
                    let html = '';
                    tracks.forEach(track => {
                        const img = track.thumbnails ? track.thumbnails[track.thumbnails.length - 1].url : '';
                        const artist = track.artists ? track.artists.map(a => a.name).join(', ') : 'Unknown';
                        html += createTrackElement(track.title, artist, img, track.videoId);
                    });
                    resultsContainer.innerHTML = html;
                }
            } catch (error) {
                resultsContainer.innerHTML = '<p style="color: #ff5252;">Gagal memuat data dari server API.</p>';
            }
            loader.style.display = 'none';
        }

        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length === 0) {
                loadCharts();
                return;
            }

            searchTimeout = setTimeout(async () => {
                loader.style.display = 'block';
                resultsContainer.innerHTML = '';
                statusTitle.innerText = `Hasil pencarian: "${query}"`;

                try {
                    const response = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        let html = '';
                        result.data.forEach(track => {
                            const img = track.thumbnails ? track.thumbnails[track.thumbnails.length - 1].url : '';
                            const artist = track.artists ? track.artists.map(a => a.name).join(', ') : 'Unknown';
                            html += createTrackElement(track.title, artist, img, track.videoId);
                        });
                        resultsContainer.innerHTML = html;
                    }
                } catch (error) {
                    console.error("Error searching:", error);
                }
                loader.style.display = 'none';
            }, 800);
        });

        async function getLyrics(videoId) {
            alert("Sedang mencari lirik...");
            try {
                const response = await fetch(`/api/lyrics?video_id=${videoId}`);
                const result = await response.json();
                if(result.status === 'success' && result.data.lyrics) {
                    alert(result.data.lyrics);
                } else {
                    alert("Lirik tidak tersedia untuk lagu ini.");
                }
            } catch(e) {
                alert("Gagal mengambil lirik.");
            }
        }

        window.onload = loadCharts;
    </script>
</body>
</html>
