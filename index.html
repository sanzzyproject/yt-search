<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SANN404 FORUM - Music Player</title>
    <style>
        :root {
            --spotify-black: #121212;
            --spotify-base: #000000;
            --spotify-highlight: #1a1a1a;
            --spotify-green: #1ed760;
            --text-primary: #ffffff;
            --text-subdued: #b3b3b3;
            --nav-bg: rgba(0, 0, 0, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Circular', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--spotify-base);
            color: var(--text-primary);
            padding-bottom: 100px; /* Space for bottom nav */
            overflow-x: hidden;
        }

        /* Header / App Bar */
        header {
            padding: 40px 16px 16px;
            background: linear-gradient(rgba(0,0,0,0.6) 0%, var(--spotify-base) 100%);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #535353;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Search Section */
        .search-container {
            padding: 8px 16px 16px;
            position: sticky;
            top: 88px;
            background-color: var(--spotify-base);
            z-index: 99;
        }

        .search-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            width: 24px;
            height: 24px;
            fill: var(--spotify-black);
        }

        .search-box {
            width: 100%;
            background: #ffffff;
            border: none;
            padding: 12px 16px 12px 44px;
            border-radius: 4px;
            color: var(--spotify-black);
            font-size: 15px;
            font-weight: 500;
            outline: none;
        }

        .search-box::placeholder {
            color: #535353;
        }

        /* Content Area */
        .content-section {
            padding: 0 16px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 16px;
            margin-top: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Track List UI (Spotify Style) */
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 0; /* Spotify lists have no gap, just padding */
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            gap: 12px;
            background: transparent;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        .track-item:active {
            background-color: var(--spotify-highlight);
        }

        .track-img {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
            background: #282828;
            flex-shrink: 0;
        }

        .track-info {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .track-title {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .track-artist {
            font-size: 14px;
            color: var(--text-subdued);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-action-icon {
            width: 24px;
            height: 24px;
            fill: var(--text-subdued);
            padding: 4px;
            flex-shrink: 0;
        }

        /* Bottom Navigation (Spotify Style) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 12px 16px 20px;
            z-index: 1000;
            background-image: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.8));
        }

        .nav-item {
            color: var(--text-subdued);
            text-decoration: none;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: var(--text-primary);
        }

        /* Loading Spinner */
        .loader {
            text-align: center;
            color: var(--text-subdued);
            padding: 32px 20px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        /* Modal Lirik (Spotify Lyrics Style) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgb(83, 83, 83);
            background-image: linear-gradient(180deg, rgba(83,83,83,1) 0%, rgba(18,18,18,1) 100%);
            display: none;
            flex-direction: column;
            z-index: 2000;
            animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 24px 20px;
            background: transparent;
        }

        .modal-header h3 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .close-btn {
            background: rgba(0,0,0,0.3);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 60px;
            color: var(--text-primary);
            font-size: 24px;
            line-height: 1.5;
            white-space: pre-wrap;
            font-weight: 700;
            text-align: left;
        }

        .modal-body::-webkit-scrollbar {
            display: none; /* Hide scrollbar for clean look */
        }
    </style>
</head>
<body>

    <header>
        <div class="profile-img">S</div>
        <h1 id="greeting">SANN404 FORUM</h1>
    </header>

    <div class="search-container">
        <div class="search-box-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 101.414-1.414l-4.344-4.344a9.157 9.157 0 002.077-5.816c0-5.14-4.226-9.279-9.407-9.279zm-7.407 9.279c0-4.006 3.302-7.279 7.407-7.279s7.407 3.273 7.407 7.279-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.279z"></path>
            </svg>
            <input type="text" class="search-box" id="searchInput" placeholder="Apa yang ingin kamu dengarkan?">
        </div>
    </div>

    <div class="content-section">
        <h2 class="section-title" id="statusTitle">Rekomendasi Untukmu</h2>
        <div id="loader" class="loader">Memuat...</div>
        <div class="track-list" id="resultsContainer"></div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M12.5 3.247a1 1 0 00-1 0L4 7.577V20h4.5v-6a1 1 0 011-1h5a1 1 0 011 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 013 0l7.5 4.33a2 2 0 011 1.732V21a1 1 0 01-1 1h-6.5a1 1 0 01-1-1v-6h-3v6a1 1 0 01-1 1H3a1 1 0 01-1-1V7.577a2 2 0 011-1.732l7.5-4.33z"></path></svg>
            Home
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 101.414-1.414l-4.344-4.344a9.157 9.157 0 002.077-5.816c0-5.14-4.226-9.279-9.407-9.279zm-7.407 9.279c0-4.006 3.302-7.279 7.407-7.279s7.407 3.273 7.407 7.279-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.279z"></path></svg>
            Search
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M14.5 2.134a1 1 0 011 0l6 3.464a1 1 0 01.5.866V21a1 1 0 01-1 1h-6a1 1 0 01-1-1V3a1 1 0 01.5-.866zM16 4.732V20h4V7.041l-4-2.309zM3 22a1 1 0 01-1-1V3a1 1 0 012 0v18a1 1 0 01-1 1zm6 0a1 1 0 01-1-1V3a1 1 0 012 0v18a1 1 0 01-1 1z"></path></svg>
            Your Library
        </a>
    </nav>

    <div id="lyricsModal" class="modal-overlay">
        <div class="modal-header">
            <h3>Lirik</h3>
            <div class="close-btn" onclick="closeLyrics()">✕</div>
        </div>
        <div id="lyricsBody" class="modal-body"></div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const statusTitle = document.getElementById('statusTitle');
        const loader = document.getElementById('loader');
        const lyricsModal = document.getElementById('lyricsModal');
        const lyricsBody = document.getElementById('lyricsBody');
        const greetingElement = document.getElementById('greeting');

        // Dynamic Greeting based on time
        const hour = new Date().getHours();
        if (hour < 12) greetingElement.innerText = "Selamat pagi";
        else if (hour < 18) greetingElement.innerText = "Selamat siang";
        else greetingElement.innerText = "Selamat malam";

        // Render UI Item Lagu (Format Spotify)
        function createTrackElement(title, artist, imgUrl, videoId) {
            return `
                <div class="track-item" onclick="getLyrics('${videoId}')">
                    <img src="${imgUrl}" alt="Cover" class="track-img">
                    <div class="track-info">
                        <div class="track-title">${title}</div>
                        <div class="track-artist">${artist}</div>
                    </div>
                    <svg class="track-action-icon" viewBox="0 0 24 24">
                        <path d="M4.5 13.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm15 0a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm-7.5 0a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"></path>
                    </svg>
                </div>
            `;
        }

        // Fetch Data Beranda
        async function loadCharts() {
            loader.style.display = 'block';
            resultsContainer.innerHTML = '';
            statusTitle.innerText = "Rekomendasi Untukmu";

            try {
                const response = await fetch('/api/search?query=lagu+indonesia+terbaru+hits');
                const result = await response.json();
                
                if (result.status === 'success') {
                    const tracks = result.data.slice(0, 10);
                    let html = '';
                    tracks.forEach(track => {
                        const img = track.thumbnails ? track.thumbnails[track.thumbnails.length - 1].url : '';
                        const artist = track.artists ? track.artists.map(a => a.name).join(', ') : 'Unknown';
                        html += createTrackElement(track.title, artist, img, track.videoId);
                    });
                    resultsContainer.innerHTML = html;
                }
            } catch (error) {
                resultsContainer.innerHTML = '<p style="color: #b3b3b3; font-size: 14px; text-align: center; padding: 20px;">Gagal memuat. Periksa koneksi Anda.</p>';
            }
            loader.style.display = 'none';
        }

        // Fetch Data Pencarian
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length === 0) {
                loadCharts();
                return;
            }

            searchTimeout = setTimeout(async () => {
                loader.style.display = 'block';
                resultsContainer.innerHTML = '';
                statusTitle.innerText = `Hasil pencarian untuk "${query}"`;

                try {
                    const response = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        let html = '';
                        result.data.forEach(track => {
                            const img = track.thumbnails ? track.thumbnails[track.thumbnails.length - 1].url : '';
                            const artist = track.artists ? track.artists.map(a => a.name).join(', ') : 'Unknown';
                            html += createTrackElement(track.title, artist, img, track.videoId);
                        });
                        resultsContainer.innerHTML = html;
                    }
                } catch (error) {
                    console.error("Error searching:", error);
                }
                loader.style.display = 'none';
            }, 800);
        });

        // Tampilkan Modal & Fetch Lirik
        async function getLyrics(videoId) {
            lyricsModal.style.display = 'flex';
            lyricsBody.innerHTML = '<div style="color: rgba(255,255,255,0.7); font-size: 18px; text-align: center; margin-top: 40px;">Mencari lirik...</div>';

            try {
                const response = await fetch(`/api/lyrics?video_id=${videoId}`);
                const result = await response.json();
                
                if(result.status === 'success' && result.data.lyrics) {
                    lyricsBody.innerHTML = result.data.lyrics;
                } else {
                    lyricsBody.innerHTML = '<div style="color: rgba(255,255,255,0.7); font-size: 18px; text-align: center; margin-top: 40px;">Lirik tidak tersedia.</div>';
                }
            } catch(e) {
                lyricsBody.innerHTML = '<div style="color: rgba(255,255,255,0.7); font-size: 18px; text-align: center; margin-top: 40px;">Gagal memuat lirik.</div>';
            }
        }

        function closeLyrics() {
            lyricsModal.style.display = 'none';
            lyricsBody.innerHTML = '';
        }

        window.onload = loadCharts;
    </script>
</body>
</html>
